# Production nginx config for obsidiannotes.piersonl.com (rack VPS)
# Installed at /etc/nginx/sites-available/obsidiannotes.piersonl.com
# TLS blocks are managed by certbot.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name obsidiannotes.piersonl.com;

    root /var/www/obsidianNotes-quartz/public;
    index index.html;
    error_page 404 /404.html;

    location / {
        try_files $uri $uri.html $uri/ /index.html =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    ssl_certificate /etc/letsencrypt/live/obsidiannotes.piersonl.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/obsidiannotes.piersonl.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name obsidiannotes.piersonl.com;
    return 301 https://$host$request_uri;
}
